version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds connaio and connaio-core for Linux against GTK 3 and WebKit2GTK 4.1, which Ubuntu 22.04 has
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          DEV:
            ref: .DEV
    cmds:
      - go build {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}"
      - task: build:core
    vars:
      VERSION:
        sh: git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo 0.0.0
      BUILD_FLAGS: '{{if eq .DEV "true"}}-tags gtk3 -buildvcs=false -gcflags=all="-l"{{else}}-tags production,gtk3 -trimpath -buildvcs=false -ldflags="-w -s -X github.com/ryanzhangtianran/Connaio/internal/app.appVersion={{.VERSION}}"{{end}}'
    env:
      GOOS: linux
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'

  build:core:
    summary: Builds connaio-core from CORE_DIR into BIN_DIR
    internal: true
    cmds:
      # the core reports constant.Version, a 1.10.0 placeholder unless set here, as mihomo's Makefile does
      - CGO_ENABLED=0 go -C "{{.CORE_DIR}}" build -tags with_gvisor -trimpath -ldflags="-w -s -X github.com/metacubex/mihomo/constant.Version={{.CORE_VERSION}}" -o "{{.ROOT_DIR}}/{{.BIN_DIR}}/connaio-core" .
    vars:
      CORE_VERSION:
        sh: git -C "{{.CORE_DIR}}" describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo unknown # the mihomo release it is based on
    env:
      GOOS: linux
      GOARCH: '{{.ARCH | default ARCH}}'

  package:
    summary: Packages a production build as a .deb for Ubuntu 22.04 and later
    deps:
      - task: build
    cmds:
      - wails3 tool package -name {{.APP_NAME}} -format deb -config ./build/linux/nfpm/nfpm.yaml -out "{{.ROOT_DIR}}/{{.BIN_DIR}}"
    env:
      GOARCH: '{{.ARCH | default ARCH}}'
      VERSION:
        sh: git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo 0.0.0

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}'
