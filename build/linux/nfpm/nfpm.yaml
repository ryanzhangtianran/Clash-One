# The .deb for Ubuntu 22.04+ (see https://nfpm.goreleaser.com); GOARCH and VERSION come from the
# environment, set by build/linux/Taskfile.yml.
name: connaio
arch: ${GOARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: ryanzhangtianran <ryanzhangtianran@users.noreply.github.com>
description: Rule-based proxy client with reverse tunnels, built on mihomo
homepage: https://github.com/ryanzhangtianran/Connaio
license: GPL-3.0

# the core sits next to the GUI, where core.Binary looks for it
contents:
  - src: ./bin/connaio
    dst: /usr/lib/connaio/connaio
  - src: ./bin/connaio-core
    dst: /usr/lib/connaio/connaio-core
  - src: /usr/lib/connaio/connaio
    dst: /usr/bin/connaio
    type: symlink
  - src: ./build/appicon.png
    dst: /usr/share/pixmaps/connaio.png
  - src: ./build/linux/connaio.desktop
    dst: /usr/share/applications/connaio.desktop

# GTK 3 and WebKit2GTK 4.1: the newest web view Ubuntu 22.04 ships (24.04 provides them too)
depends:
  - libgtk-3-0
  - libwebkit2gtk-4.1-0

scripts:
  postinstall: ./build/linux/nfpm/postinstall.sh
